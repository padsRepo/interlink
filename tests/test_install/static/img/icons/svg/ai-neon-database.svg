<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Gradient Definition -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BFFF;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#8A2BE2;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#FF1493;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Sparkle Animation -->
    <radialGradient id="sparkle">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <!--
  <rect width="200" height="200" fill="#000000"/>
  -->
  
  <!-- Database Cylinder - Top Ellipse -->
  <ellipse cx="100" cy="60" rx="50" ry="18" 
           fill="none" 
           stroke="url(#neonGradient)" 
           stroke-width="3" 
           filter="url(#strongGlow)">
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Database Cylinder - Middle Ellipse -->
  <ellipse cx="100" cy="100" rx="50" ry="18" 
           fill="none" 
           stroke="url(#neonGradient)" 
           stroke-width="3" 
           filter="url(#strongGlow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Database Cylinder - Bottom Ellipse -->
  <ellipse cx="100" cy="140" rx="50" ry="18" 
           fill="none" 
           stroke="url(#neonGradient)" 
           stroke-width="3" 
           filter="url(#strongGlow)">
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Left Vertical Line -->
  <line x1="50" y1="60" x2="50" y2="140" 
        stroke="url(#neonGradient)" 
        stroke-width="3" 
        filter="url(#strongGlow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </line>
  
  <!-- Right Vertical Line -->
  <line x1="150" y1="60" x2="150" y2="140" 
        stroke="url(#neonGradient)" 
        stroke-width="3" 
        filter="url(#strongGlow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </line>
  
  <!-- Sparkle Effects -->
  <circle cx="140" cy="55" r="2" fill="url(#sparkle)" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="65" cy="95" r="2" fill="url(#sparkle)" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="130" cy="135" r="2" fill="url(#sparkle)" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Text Label -->
  <text x="100" y="175" 
        font-family="Orbitron, monospace, sans-serif" 
        font-size="16" 
        fill="url(#neonGradient)" 
        text-anchor="middle" 
        filter="url(#glow)"
        font-weight="bold">
    DATABASE
  </text>
</svg>