<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Add User Icon</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #000000;
      font-family: 'Orbitron', sans-serif;
    }

    .icon-container {
      text-align: center;
      padding: 40px;
    }

    .neon-icon {
      width: 100px;
      height: 100px;
      margin: 0 auto;
      position: relative;
      animation: pulse 2s ease-in-out infinite;
    }

    svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 10px currentColor) 
              drop-shadow(0 0 20px currentColor) 
              drop-shadow(0 0 30px currentColor);
    }

    .icon-path {
      stroke: url(#neonGradient);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 10px #fff, 0 0 20px #00BFFF;
      animation: sparkle 1.5s ease-in-out infinite;
    }

    .sparkle:nth-child(1) {
      top: 10%;
      left: 20%;
      animation-delay: 0s;
    }

    .sparkle:nth-child(2) {
      top: 80%;
      right: 15%;
      animation-delay: 0.5s;
    }

    .sparkle:nth-child(3) {
      top: 40%;
      right: 10%;
      animation-delay: 1s;
    }

    .icon-label {
      margin-top: 20px;
      font-size: 16px;
      background: linear-gradient(90deg, #00BFFF, #8A2BE2, #FF1493, #FFA500);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
      text-shadow: 0 0 20px rgba(0, 191, 255, 0.5);
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.05);
        opacity: 0.9;
      }
    }

    @keyframes sparkle {
      0%, 100% {
        opacity: 0;
        transform: scale(0);
      }
      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .neon-icon:hover {
      animation: pulse 0.5s ease-in-out infinite;
    }

    .neon-icon:hover svg {
      filter: drop-shadow(0 0 15px currentColor) 
              drop-shadow(0 0 30px currentColor) 
              drop-shadow(0 0 45px currentColor);
    }
  </style>
</head>
<body>
  <div class="icon-container">
    <div class="neon-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <defs>
          <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00BFFF;stop-opacity:1" />
            <stop offset="33%" style="stop-color:#8A2BE2;stop-opacity:1" />
            <stop offset="66%" style="stop-color:#FF1493;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
          </linearGradient>
        </defs>
        
        <!-- User head -->
        <circle class="icon-path" cx="9" cy="7" r="4"/>
        
        <!-- User body -->
        <path class="icon-path" d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
        
        <!-- Plus sign -->
        <line class="icon-path" x1="19" y1="8" x2="19" y2="14"/>
        <line class="icon-path" x1="16" y1="11" x2="22" y2="11"/>
      </svg>
      
      <div class="sparkle"></div>
      <div class="sparkle"></div>
      <div class="sparkle"></div>
    </div>
    
    <div class="icon-label">Add User</div>
  </div>
</body>
</html>