<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient: blue to pink to orange -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#7b2ff7;stop-opacity:1" />
      <stop offset="65%" style="stop-color:#ff0080;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:1" />
    </linearGradient>
    
    <!-- Intense outer glow (4 layers) -->
    <filter id="neonGlow" x="-100%" y="-100%" width="300%" height="300%">
      <!-- Outer cyan glow -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="20" result="blur1"/>
      <feFlood flood-color="#00d4ff" flood-opacity="0.8"/>
      <feComposite in2="blur1" operator="in" result="glow1"/>
      
      <!-- Mid purple glow -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur2"/>
      <feFlood flood-color="#7b2ff7" flood-opacity="0.9"/>
      <feComposite in2="blur2" operator="in" result="glow2"/>
      
      <!-- Inner pink glow -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur3"/>
      <feFlood flood-color="#ff0080" flood-opacity="1"/>
      <feComposite in2="blur3" operator="in" result="glow3"/>
      
      <!-- Brightest white core -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur4"/>
      <feFlood flood-color="#ffffff" flood-opacity="1"/>
      <feComposite in2="blur4" operator="in" result="glow4"/>
      
      <feMerge>
        <feMergeNode in="glow1"/>
        <feMergeNode in="glow2"/>
        <feMergeNode in="glow3"/>
        <feMergeNode in="glow4"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Sparkle glow -->
    <filter id="sparkleGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="1"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark background with gradient -->
  <rect width="512" height="512" fill="#0a0510"/>
  <radialGradient id="bgGlow" cx="50%" cy="50%">
    <stop offset="0%" style="stop-color:#1a0a2e;stop-opacity:0.5" />
    <stop offset="100%" style="stop-color:#0a0510;stop-opacity:1" />
  </radialGradient>
  <rect width="512" height="512" fill="url(#bgGlow)"/>
  
  <!-- ICON SHAPE -->
  <g filter="url(#neonGlow)">
    <!-- Outer circle -->
    <circle cx="256" cy="256" r="130" 
            fill="none" 
            stroke="url(#mainGradient)" 
            stroke-width="8"/>
    
    <!-- Info "i" dot -->
    <circle cx="256" cy="200" r="18" fill="url(#mainGradient)"/>
    
    <!-- Info "i" stem -->
    <rect x="246" y="240" width="20" height="100" 
          fill="url(#mainGradient)" 
          rx="10"/>
  </g>
  <!-- END ICON SHAPE -->
  
  <!-- Four-pointed sparkles (LEFT SIDE - cyan/purple) -->
  <g filter="url(#sparkleGlow)">
    <path d="M 100 150 L 102 155 L 107 157 L 102 159 L 100 164 L 98 159 L 93 157 L 98 155 Z" 
          fill="#00d4ff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 130 100 L 131 103 L 134 104 L 131 105 L 130 108 L 129 105 L 126 104 L 129 103 Z" 
          fill="#00d4ff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <path d="M 85 200 L 86 202 L 88 203 L 86 204 L 85 206 L 84 204 L 82 203 L 84 202 Z" 
          fill="#7b2ff7">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 70 280 L 72 285 L 77 287 L 72 289 L 70 294 L 68 289 L 63 287 L 68 285 Z" 
          fill="#7b2ff7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="0.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 110 320 L 111 323 L 114 324 L 111 325 L 110 328 L 109 325 L 106 324 L 109 323 Z" 
          fill="#00d4ff">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.9s" begin="0.7s" repeatCount="indefinite"/>
    </path>
    <path d="M 90 360 L 91 363 L 94 364 L 91 365 L 90 368 L 89 365 L 86 364 L 89 363 Z" 
          fill="#7b2ff7">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.1s" begin="0.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Four-pointed sparkles (RIGHT SIDE - orange/pink) -->
  <g filter="url(#sparkleGlow)">
    <path d="M 430 200 L 432 205 L 437 207 L 432 209 L 430 214 L 428 209 L 423 207 L 428 205 Z" 
          fill="#ff6b35">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.3s" begin="0.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 410 250 L 411 253 L 414 254 L 411 255 L 410 258 L 409 255 L 406 254 L 409 253 Z" 
          fill="#ff0080">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.9s" begin="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 445 280 L 447 285 L 452 287 L 447 289 L 445 294 L 443 289 L 438 287 L 443 285 Z" 
          fill="#ff6b35">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <path d="M 420 330 L 421 333 L 424 334 L 421 335 L 420 338 L 419 335 L 416 334 L 419 333 Z" 
          fill="#ff0080">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 400 140 L 402 145 L 407 147 L 402 149 L 400 154 L 398 149 L 393 147 L 398 145 Z" 
          fill="#ff6b35">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" begin="0.1s" repeatCount="indefinite"/>
    </path>
    <path d="M 460 360 L 461 363 L 464 364 L 461 365 L 460 368 L 459 365 L 456 364 L 459 363 Z" 
          fill="#ff0080">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" begin="0.8s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Small dot sparkles -->
  <g filter="url(#sparkleGlow)">
    <circle cx="120" cy="230" r="1.5" fill="#7b2ff7">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="440" cy="235" r="1.5" fill="#ff6b35">
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="95" cy="170" r="1.5" fill="#00d4ff">
      <animate attributeName="opacity" values="0;1;0" dur="2.3s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="130" r="1.5" fill="#7b2ff7">
      <animate attributeName="opacity" values="0;1;0" dur="2.1s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="75" cy="340" r="1.5" fill="#00d4ff">
      <animate attributeName="opacity" values="0;1;0" dur="1.9s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="170" r="1.5" fill="#ff6b35">
      <animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="455" cy="310" r="1.5" fill="#ff0080">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="430" cy="120" r="1.5" fill="#ff6b35">
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="0.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="400" r="1.5" fill="#7b2ff7">
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="435" cy="390" r="1.5" fill="#ff0080">
      <animate attributeName="opacity" values="0;1;0" dur="2.1s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>