<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wormhole OS v2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
:root{
  --bg:#070012;
  --panel:rgba(10,0,25,0.65);
  --border:rgba(255,43,214,0.25);
  --magenta:#ff2bd6;
  --blue:#00d9ff;
  --text:#f5f3ff;
  --muted:#7c7a99;
  --glow:0 0 20px rgba(255,43,214,0.4);
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:monospace;
  overflow:hidden;
}

/* ================= CANVAS BG ================= */
#bg{
  position:fixed;
  inset:0;
  z-index:-1;
}

/* ================= BOOT ================= */
.screen{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

#boot{
  background:black;
  z-index:1000;
}

#login{
  display:none;
}

#desktop{
  display:none;
}

/* ================= WINDOWS ================= */
.window{
  position:absolute;
  width:320px;
  height:220px;
  background:var(--panel);
  border:1px solid var(--border);
  box-shadow:var(--glow);
  backdrop-filter:blur(10px);
  overflow:hidden;
}

.titlebar{
  background:rgba(255,43,214,0.1);
  padding:5px;
  cursor:move;
  display:flex;
  justify-content:space-between;
}

.content{
  padding:10px;
  height:calc(100% - 30px);
  overflow:auto;
}

/* ================= TASKBAR ================= */
#taskbar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:40px;
  background:rgba(0,0,0,0.6);
  border-top:1px solid var(--border);
  display:flex;
  gap:10px;
  align-items:center;
  padding:0 10px;
}

/* ================= TERMINAL ================= */
.terminal{
  background:black;
  color:var(--blue);
  font-size:12px;
}

/* ================= INPUT ================= */
input,button{
  background:black;
  color:var(--text);
  border:1px solid var(--border);
  padding:6px;
}

/* ================= BOOT TEXT ================= */
.boot-text{
  color:var(--blue);
  white-space:pre;
  animation:flicker 1.5s infinite;
}

@keyframes flicker{
  0%,100%{opacity:1}
  50%{opacity:.3}
}
</style>
</head>

<body>

<!-- ================= BIOS / BOOT ================= -->
<div id="boot" class="screen">
<div class="boot-text">
WORMHOLE BIOS v2.1
CHECKING MEMORY........OK
LOADING KERNEL.........OK
INIT NEURAL LINK.......OK
BOOT COMPLETE
</div>
</div>

<!-- ================= LOGIN ================= -->
<div id="login" class="screen">
<h2>ACCESS TERMINAL</h2>
<input id="pass" placeholder="password"/>
<button onclick="login()">ENTER</button>
</div>

<!-- ================= DESKTOP ================= -->
<div id="desktop">

<div id="taskbar">
<button onclick="openApp('terminal')">Terminal</button>
<button onclick="openApp('files')">Files</button>
<button onclick="openApp('logs')">Logs</button>
</div>

<!-- TERMINAL -->
<div class="window" id="terminal" style="top:60px;left:60px;display:none;">
<div class="titlebar" onmousedown="dragStart(event,this.parentNode)">
Terminal <span onclick="closeApp('terminal')">X</span>
</div>
<div class="content terminal" id="termOut">
> system online
</div>
<input id="cmd" onkeydown="if(event.key==='Enter')runCmd()"/>
</div>

<!-- FILE SYSTEM -->
<div class="window" id="files" style="top:100px;left:420px;display:none;">
<div class="titlebar" onmousedown="dragStart(event,this.parentNode)">
File System <span onclick="closeApp('files')">X</span>
</div>
<div class="content" id="fs">
/home<br>/sys<br>/opt<br>
</div>
</div>

<!-- LOGS -->
<div class="window" id="logs" style="top:200px;left:200px;display:none;">
<div class="titlebar" onmousedown="dragStart(event,this.parentNode)">
Logs <span onclick="closeApp('logs')">X</span>
</div>
<div class="content" id="logBox">
[OK] boot complete<br>
</div>
</div>

</div>

<!-- ================= THREE JS BG ================= -->
<canvas id="bg"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* ================= PERSISTENCE ================= */
let state = JSON.parse(localStorage.getItem("wormhole")) || {
  loggedIn:false,
  files:["home","sys","opt"],
  logs:["boot initialized"]
};

function save(){
  localStorage.setItem("wormhole",JSON.stringify(state));
}

/* ================= BOOT FLOW ================= */
setTimeout(()=>{
  document.getElementById("boot").style.display="none";
  if(state.loggedIn){
    document.getElementById("desktop").style.display="block";
  }else{
    document.getElementById("login").style.display="flex";
  }
},2500);

function login(){
  state.loggedIn=true;
  save();
  document.getElementById("login").style.display="none";
  document.getElementById("desktop").style.display="block";
}

/* ================= WINDOW SYSTEM ================= */
function openApp(id){
  document.getElementById(id).style.display="block";
}

function closeApp(id){
  document.getElementById(id).style.display="none";
}

/* ================= DRAG SYSTEM ================= */
let dragObj=null,offsetX=0,offsetY=0;

function dragStart(e,el){
  dragObj=el;
  offsetX=e.clientX-el.offsetLeft;
  offsetY=e.clientY-el.offsetTop;
}

document.addEventListener("mousemove",e=>{
  if(dragObj){
    dragObj.style.left=(e.clientX-offsetX)+"px";
    dragObj.style.top=(e.clientY-offsetY)+"px";
  }
});

document.addEventListener("mouseup",()=>dragObj=null);

/* ================= TERMINAL COMMANDS ================= */
function runCmd(){
  let input=document.getElementById("cmd");
  let out=document.getElementById("termOut");
  let cmd=input.value;
  input.value="";

  if(cmd==="help"){
    out.innerHTML+="<br>commands: ls, open logs, sysinfo";
  }
  else if(cmd==="ls"){
    out.innerHTML+="<br>"+state.files.join(" ");
  }
  else if(cmd==="sysinfo"){
    out.innerHTML+="<br>WORMHOLE OS ACTIVE";
  }
  else if(cmd==="open logs"){
    openApp("logs");
  }

  state.logs.push(cmd);
  save();
}

/* ================= PERSISTENCE ================= */
let state = JSON.parse(localStorage.getItem("wormhole")) || {
  loggedIn:false,
  files:["home","sys","opt"],
  logs:["boot initialized"]

  document.getElementById("boot").style.display="none";
  if(state.loggedIn){
    document.getElementById("desktop").style.display="block";
  }else{
    document.getElementById("login").style.display="flex";
  }
},2500);

function login(){
  state.loggedIn=true;
  save();
  document.getElementById("login").style.display="none";
  document.getElementById("desktop").style.display="block";
}

/* ================= WINDOW SYSTEM ================= */
function openApp(id){
  document.getElementById(id).style.display="block";
}

function closeApp(id){
  document.getElementById(id).style.display="none";
}

/* ================= DRAG SYSTEM ================= */
let dragObj=null,offsetX=0,offsetY=0;

function dragStart(e,el){
  dragObj=el;
  offsetX=e.clientX-el.offsetLeft;
  offsetY=e.clientY-el.offsetTop;
}

document.addEventListener("mousemove",e=>{
  if(dragObj){
    dragObj.style.left=(e.clientX-offsetX)+"px";
    dragObj.style.top=(e.clientY-offsetY)+"px";
  }
});

document.addEventListener("mouseup",()=>dragObj=null);

/* ================= TERMINAL COMMANDS ================= */
function runCmd(){
  let input=document.getElementById("cmd");
  let out=document.getElementById("termOut");
  let cmd=input.value;
  input.value="";

  if(cmd==="help"){
    out.innerHTML+="<br>commands: ls, open logs, sysinfo";
  }
  else if(cmd==="ls"){
    out.innerHTML+="<br>"+state.files.join(" ");
  }
  else if(cmd==="sysinfo"){
    out.innerHTML+="<br>WORMHOLE OS ACTIVE";
  }
  else if(cmd==="open logs"){
    openApp("logs");
  }

  state.logs.push(cmd);
  save();
}

/* ================= THREE JS BACKGROUND ================= */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById("bg"),
  alpha: true,
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
camera.position.z = 80;

/* ================= NEURON SYSTEM ================= */
let neurons = [];
let connections = [];

const maxNeurons = 600;

/* geometry for points */
const geo = new THREE.BufferGeometry();
const positions = new Float32Array(maxNeurons * 3);

for (let i = 0; i < maxNeurons; i++) {
  neurons.push({
    x: (Math.random() - 0.5) * 120,
    y: (Math.random() - 0.5) * 120,
    z: (Math.random() - 0.5) * 120,
    vx: 0,
    vy: 0,
    vz: 0,
    life: Math.random() * 100
  });
}

geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));

const material = new THREE.PointsMaterial({
  color: 0x39ff99,
  size: 0.8,
  transparent: true,
  opacity: 0.9
});

const points = new THREE.Points(geo, material);
scene.add(points);

/* ================= NEURAL GROWTH RULES ================= */
function attract(a, b) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const dz = b.z - a.z;
  const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);

  if (dist < 40 && dist > 0.1) {
    const force = 0.0008;

    a.vx += dx * force;
    a.vy += dy * force;
    a.vz += dz * force;
  }
}

/* ================= ANIMATION LOOP ================= */
function animate() {
  requestAnimationFrame(animate);

  const pos = geo.attributes.position.array;

  /* reset connections (visual simplicity) */
  connections = [];

  for (let i = 0; i < neurons.length; i++) {
    let n = neurons[i];

    /* decay + drift */
    n.vx *= 0.96;
    n.vy *= 0.96;
    n.vz *= 0.96;

    n.x += n.vx;
    n.y += n.vy;
    n.z += n.vz;

    /* boundary soft containment */
    const limit = 60;
    if (Math.abs(n.x) > limit) n.vx *= -1;
    if (Math.abs(n.y) > limit) n.vy *= -1;
    if (Math.abs(n.z) > limit) n.vz *= -1;

    /* interaction with nearby neurons */
    for (let j = i + 1; j < neurons.length; j++) {
      let m = neurons[j];
      attract(n, m);

      const dx = n.x - m.x;
      const dy = n.y - m.y;
      const dz = n.z - m.z;
      const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);

      /* FORM SYNAPSES (CONNECTIONS) */
      if (dist < 18) {
        connections.push([n, m]);
      }
    }

    /* WRITE POSITION */
    pos[i * 3] = n.x;
    pos[i * 3 + 1] = n.y;
    pos[i * 3 + 2] = n.z;
  }

  geo.attributes.position.needsUpdate = true;

  /* subtle system drift */
  points.rotation.y += 0.0008;
  points.rotation.x += 0.0003;

  renderer.render(scene, camera);
}

animate();

/* ================= RESIZE ================= */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
function hash(str){
  let h = 0;
  for(let i=0;i<str.length;i++){
    h = (h << 5) - h + str.charCodeAt(i);
    h |= 0;
  }
  return h;
}

/* MAP PATH → NEURAL POSITION */
function pathToNeuron(path){
  const h = hash(path);
  const idx = Math.abs(h) % neurons.length;
  return neurons[idx];
}
function touch(name){
  let node = getPath(cwd);

  node.children[name] = {
    type:"file",
    content:"",
    memory:true,
    intensity: 1
  };

  /* LINK FILE → NEURAL NODE */
  const neuron = pathToNeuron(cwd + "/" + name);
  neuron.vx += (Math.random()-0.5)*2;
  neuron.vy += (Math.random()-0.5)*2;
  neuron.vz += (Math.random()-0.5)*2;

  save();
}
function cat(name){
  let node = getPath(cwd);
  let file = node.children[name];

  if(!file) return "null";

  const neuron = pathToNeuron(cwd + "/" + name);

  /* MEMORY REINFORCEMENT */
  neuron.vx *= 0.5;
  neuron.vy *= 0.5;
  neuron.vz *= 0.5;

  return file.content || "empty memory";
}
function mkdir(name){
  let node = getPath(cwd);

  node.children[name] = {
    type:"dir",
    children:{},
    memoryRegion:true
  };

  /* SHIFT NEURAL CLUSTER */
  const neuron = pathToNeuron(cwd + "/" + name);

  for(let i=0;i<20;i++){
    neuron.vx += (Math.random()-0.5)*5;
    neuron.vy += (Math.random()-0.5)*5;
    neuron.vz += (Math.random()-0.5)*5;
  }

  save();
}
function memoryResonance(){
  for(let i=0;i<neurons.length;i++){
    let n = neurons[i];

    /* subtle drift toward “memory stability” */
    n.vx += Math.sin(n.y * 0.01) * 0.0002;
    n.vy += Math.cos(n.x * 0.01) * 0.0002;
  }
}
