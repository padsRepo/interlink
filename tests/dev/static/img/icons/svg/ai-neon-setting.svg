<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient: blue to pink to orange -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#7b2ff7;stop-opacity:1" />
      <stop offset="65%" style="stop-color:#ff0080;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:1" />
    </linearGradient>
    
    <!-- Intense outer glow (4 layers) -->
    <filter id="neonGlow" x="-100%" y="-100%" width="300%" height="300%">
      <!-- Outer cyan glow -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="20" result="blur1"/>
      <feFlood flood-color="#00d4ff" flood-opacity="0.8"/>
      <feComposite in2="blur1" operator="in" result="glow1"/>
      
      <!-- Mid purple glow -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur2"/>
      <feFlood flood-color="#7b2ff7" flood-opacity="0.9"/>
      <feComposite in2="blur2" operator="in" result="glow2"/>
      
      <!-- Inner pink glow -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur3"/>
      <feFlood flood-color="#ff0080" flood-opacity="1"/>
      <feComposite in2="blur3" operator="in" result="glow3"/>
      
      <!-- Brightest white core -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur4"/>
      <feFlood flood-color="#ffffff" flood-opacity="1"/>
      <feComposite in2="blur4" operator="in" result="glow4"/>
      
      <feMerge>
        <feMergeNode in="glow1"/>
        <feMergeNode in="glow2"/>
        <feMergeNode in="glow3"/>
        <feMergeNode in="glow4"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Sparkle glow -->
    <filter id="sparkleGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="1"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark background with gradient -->
  <!--
  <rect width="512" height="512" fill="#0a0510"/>
  <radialGradient id="bgGlow" cx="50%" cy="50%">
    <stop offset="0%" style="stop-color:#1a0a2e;stop-opacity:0.5" />
    <stop offset="100%" style="stop-color:#0a0510;stop-opacity:1" />
  </radialGradient>
  <rect width="512" height="512" fill="url(#bgGlow)"/>
  -->
  
  <!-- Administration/Settings Icon (gear/cog) -->
  <g filter="url(#neonGlow)">
    <!-- Outer gear circle -->
    <circle cx="256" cy="256" r="100" 
            fill="none" 
            stroke="url(#mainGradient)" 
            stroke-width="8" 
            stroke-linecap="round"/>
    
    <circle cx="256" cy="256" r="94" 
            fill="none" 
            stroke="url(#mainGradient)" 
            stroke-width="3" 
            stroke-linecap="round"
            opacity="0.6"/>
    
    <!-- Inner gear circle -->
    <circle cx="256" cy="256" r="50" 
            fill="none" 
            stroke="url(#mainGradient)" 
            stroke-width="8" 
            stroke-linecap="round"/>
    
    <circle cx="256" cy="256" r="46" 
            fill="none" 
            stroke="url(#mainGradient)" 
            stroke-width="3" 
            stroke-linecap="round"
            opacity="0.6"/>
    
    <!-- Gear teeth - 8 teeth around the circle -->
    <!-- Top tooth -->
    <rect x="246" y="120" width="20" height="30" rx="4"
          fill="none" 
          stroke="url(#mainGradient)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <rect x="249" y="123" width="14" height="24" rx="3"
          fill="none" 
          stroke="url(#mainGradient)" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.6"/>
    
    <!-- Top-right tooth -->
    <rect x="320" y="165" width="30" height="20" rx="4"
          transform="rotate(45 335 175)"
          fill="none" 
          stroke="url(#mainGradient)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <rect x="323" y="168" width="24" height="14" rx="3"
          transform="rotate(45 335 175)"
          fill="none" 
          stroke="url(#mainGradient)" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.6"/>
    
    <!-- Right tooth -->
    <rect x="362" y="246" width="30" height="20" rx="4"
          fill="none" 
          stroke="url(#mainGradient)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <rect x="365" y="249" width="24" height="14" rx="3"
          fill="none" 
          stroke="url(#mainGradient)" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.6"/>
    
    <!-- Bottom-right tooth -->
    <rect x="320" y="327" width="30" height="20" rx="4"
          transform="rotate(-45 335 337)"
          fill="none" 
          stroke="url(#mainGradient)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <rect x="323" y="330" width="24" height="14" rx="3"
          transform="rotate(-45 335 337)"
          fill="none" 
          stroke="url(#mainGradient)" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.6"/>
    
    <!-- Bottom tooth -->
    <rect x="246" y="362" width="20" height="30" rx="4"
          fill="none" 
          stroke="url(#mainGradient)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <rect x="249" y="365" width="14" height="24" rx="3"
          fill="none" 
          stroke="url(#mainGradient)" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.6"/>
    
    <!-- Bottom-left tooth -->
    <rect x="162" y="327" width="30" height="20" rx="4"
          transform="rotate(45 177 337)"
          fill="none" 
          stroke="url(#mainGradient)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <rect x="165" y="330" width="24" height="14" rx="3"
          transform="rotate(45 177 337)"
          fill="none" 
          stroke="url(#mainGradient)" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.6"/>
    
    <!-- Left tooth -->
    <rect x="120" y="246" width="30" height="20" rx="4"
          fill="none" 
          stroke="url(#mainGradient)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <rect x="123" y="249" width="24" height="14" rx="3"
          fill="none" 
          stroke="url(#mainGradient)" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.6"/>
    
    <!-- Top-left tooth -->
    <rect x="162" y="165" width="30" height="20" rx="4"
          transform="rotate(-45 177 175)"
          fill="none" 
          stroke="url(#mainGradient)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <rect x="165" y="168" width="24" height="14" rx="3"
          transform="rotate(-45 177 175)"
          fill="none" 
          stroke="url(#mainGradient)" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.6"/>
  </g>
  
  <!-- Four-pointed sparkles (LEFT SIDE - cyan/purple) -->
  <g filter="url(#sparkleGlow)">
    <path d="M 90 180 L 92 185 L 97 187 L 92 189 L 90 194 L 88 189 L 83 187 L 88 185 Z" 
          fill="#00d4ff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 110 120 L 111 123 L 114 124 L 111 125 L 110 128 L 109 125 L 106 124 L 109 123 Z" 
          fill="#00d4ff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <path d="M 65 260 L 66 262 L 68 263 L 66 264 L 65 266 L 64 264 L 62 263 L 64 262 Z" 
          fill="#7b2ff7">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 95 330 L 96 331 L 97 332 L 96 333 L 95 334 L 94 333 L 93 332 L 94 331 Z" 
          fill="#00d4ff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="1s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Four-pointed sparkles (RIGHT SIDE - orange/pink) -->
  <g filter="url(#sparkleGlow)">
    <path d="M 430 210 L 432 215 L 437 217 L 432 219 L 430 224 L 428 219 L 423 217 L 428 215 Z" 
          fill="#ff6b35">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.3s" begin="0.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 410 280 L 411 283 L 414 284 L 411 285 L 410 288 L 409 285 L 406 284 L 409 283 Z" 
          fill="#ff0080">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.9s" begin="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 445 340 L 446 342 L 448 343 L 446 344 L 445 346 L 444 344 L 442 343 L 444 342 Z" 
          fill="#ff6b35">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" begin="0.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 420 150 L 421 151 L 422 152 L 421 153 L 420 154 L 419 153 L 418 152 L 419 151 Z" 
          fill="#ff0080">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.7s" begin="1.2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Small dot sparkles -->
  <g filter="url(#sparkleGlow)">
    <circle cx="80" cy="220" r="1.5" fill="#7b2ff7">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="105" cy="290" r="1" fill="#00d4ff">
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="435" cy="245" r="1.5" fill="#ff6b35">
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="415" cy="180" r="1" fill="#ff0080">
      <animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>